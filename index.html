<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coruja Links</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b10;
      color: white;
    }

    header {
      padding: 25px 8%;
      border-bottom: 1px solid #20252d;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #8b5cf6;
    }

    main {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .box {
      max-width: 700px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      color: #aab2bf;
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 16px 30px;
      border: 0;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #6d28d9;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    🦉 CORUJA <span>LINKS</span>
  </div>
</header>

<main>
  <div class="box">
    <h1>CORUJA LINKS</h1>

    <p>
      Plataforma para criação e gerenciamento de links personalizados.
    </p>

    <button onclick="alert('Em breve!')">
      CRIAR LINK
    </button>
  </div>
</main>

</body>
</html>
